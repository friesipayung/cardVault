name: Build APK (alpha)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install system deps (GTK/WebKit for Wails CLI)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev pkg-config
          pkg-config --modversion gtk4
          pkg-config --modversion webkitgtk-6.0

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build APK
        run: |
          export PATH="$HOME/go/bin:$PATH"
          export CI=true
          go mod download
          wails3 task android:install:deps YES=true
          wails3 task build GOOS=android ARCH=arm64
          wails3 task android:compile:go:shared ARCH=amd64
          wails3 task android:assemble:apk BIN_DIR=build

      - name: Test install on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: adb install build/cardvault.apk

      - name: Release timestamp
        id: ts
        run: echo "ts=$(date -u +%y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: alpha-${{ steps.ts.outputs.ts }}
          name: alpha-${{ steps.ts.outputs.ts }}
          files: |
            build/**/*.apk
          prerelease: true
